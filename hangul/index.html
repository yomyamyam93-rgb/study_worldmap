<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="글자마을">
<title>글자마을</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;
    font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    user-select:none;-webkit-user-select:none;background:#bfe3f7;color:#333}
  #app{position:relative;height:100%;overflow:hidden}

  /* ── 공통 ── */
  .scr{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;overflow:hidden}
  .hidden{display:none!important}
  .sky{position:absolute;inset:0;background:linear-gradient(#aee0f9 0%,#d8f0fc 55%,#cdeab4 55.2%,#b6dd96 100%)}
  .hill{position:absolute;border-radius:50%;background:#a5d487}
  .cloud{position:absolute;font-size:44px;opacity:.85;animation:drift 36s linear infinite}
  @keyframes drift{from{transform:translateX(-10vw)}to{transform:translateX(110vw)}}

  .nextbtn{position:absolute;right:20px;bottom:20px;z-index:20;
    background:#ff9d3c;color:#fff;border:0;border-radius:32px;padding:16px 30px;
    font-size:22px;font-weight:800;box-shadow:0 5px 14px rgba(0,0,0,.22);cursor:pointer}
  .nextbtn:active{transform:scale(.94)}
  .skip{position:absolute;right:14px;top:calc(env(safe-area-inset-top) + 10px);z-index:30;
    width:40px;height:40px;border:0;border-radius:50%;background:rgba(255,255,255,.5);
    font-size:16px;color:#888;cursor:pointer}
  .talk{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 26px);transform:translateX(-50%);
    max-width:86vw;background:rgba(255,255,255,.95);border-radius:24px;padding:14px 26px;
    font-size:clamp(18px,3.4vw,26px);font-weight:800;color:#4a3b28;text-align:center;
    box-shadow:0 4px 14px rgba(0,0,0,.15);z-index:15;line-height:1.4;white-space:nowrap}
  .talk.long{white-space:normal}

  /* ── 캐릭터 ── */
  .sani{position:absolute;width:150px;height:150px;cursor:pointer;touch-action:none;z-index:8}
  .sani svg{width:100%;height:100%;overflow:visible}
  .idle{animation:idle 2.2s ease-in-out infinite}
  @keyframes idle{0%,100%{transform:scale(1,1)}50%{transform:scale(1.03,.97)}}
  .wob{animation:wob .5s ease-in-out}
  @keyframes wob{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}

  /* ── 알 ── */
  .egg{position:relative;width:min(46vh,300px);cursor:pointer;touch-action:none;
    animation:eggwob 3s ease-in-out infinite;transform-origin:50% 90%}
  @keyframes eggwob{0%,88%,100%{transform:rotate(0)}91%{transform:rotate(-4deg)}95%{transform:rotate(4deg)}}
  .egg.excited{animation:eggwob2 .5s ease-in-out infinite}
  @keyframes eggwob2{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
  .sparkle{position:absolute;font-size:34px;animation:tw 1.3s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}

  /* ── 길 그리기 ── */
  #traceWrap{position:relative;width:min(78vw,60vh,520px);aspect-ratio:1}
  #traceWrap svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none;overflow:visible}
  .guide{fill:none;stroke:#e8d9b8;stroke-width:15;stroke-linecap:round;stroke-dasharray:1 11}
  .roadink{fill:none;stroke:#d9a05b;stroke-width:15;stroke-linecap:round;stroke-linejoin:round}
  .drawink{fill:none;stroke:#f0b46e;stroke-width:15;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
  .startdot{fill:#ff5252;stroke:#fff;stroke-width:3}
  .pulse{animation:pulse 1s ease-in-out infinite}
  @keyframes pulse{50%{r:9}}
  .house{position:absolute;font-size:64px;filter:drop-shadow(0 3px 5px rgba(0,0,0,.2))}

  /* ── 냠냠 ── */
  .foods{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);
    display:flex;gap:26px;z-index:12}
  .food{width:110px;padding:10px 6px 8px;background:#fff;border-radius:22px;text-align:center;
    box-shadow:0 5px 13px rgba(0,0,0,.16);cursor:grab;touch-action:none}
  .food .fe{font-size:56px;line-height:1.1;pointer-events:none}
  .food .fn{font-size:18px;font-weight:800;color:#6b5b45;margin-top:2px;pointer-events:none}
  .food.drag{opacity:.9;z-index:50;box-shadow:0 12px 24px rgba(0,0,0,.3)}
  .cheek{animation:chew .6s ease-in-out 2}
  @keyframes chew{50%{transform:scale(1.1,.92)}}

  /* ── 손잡기 ── */
  .tree{position:absolute;width:190px;height:230px;z-index:6}
  .tree svg{width:100%;height:100%;overflow:visible}
  .block{position:absolute;width:200px;height:200px;border:6px dashed #b9a06d;border-radius:26px;
    display:flex;align-items:center;justify-content:center;z-index:14;
    background:rgba(255,255,255,.7);opacity:0;transition:opacity .4s}
  .block.on{opacity:1}
  .block svg{width:82%;height:82%}
  .roll{position:absolute;font-size:64px;z-index:16}

  /* ── 카드 ── */
  .card{width:min(78vw,420px);background:#fffdf4;border-radius:26px;padding:24px 20px;
    box-shadow:0 14px 34px rgba(80,60,20,.25);text-align:center;
    border:10px solid #ffd98a}
  .card h2{margin:2px 0 10px;font-size:26px;color:#8a6d3b}
  .card canvas{width:100%;border-radius:14px;background:#fff}
  .cardwords{font-size:22px;font-weight:800;color:#c46a1f;margin-top:10px}

  /* ── 입주식 ── */
  .newhouse{position:absolute;font-size:88px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25));
    transform:scale(0);transition:transform .6s cubic-bezier(.2,1.6,.4,1)}
  .newhouse.on{transform:scale(1)}
  .confetti{position:fixed;top:-30px;width:12px;height:18px;border-radius:3px;pointer-events:none;z-index:60}

  /* ── 마을 다시보기 메뉴 ── */
  .replay{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
    background:rgba(30,40,30,.4)}
  .replay .box{background:#fff;border-radius:26px;padding:26px 24px;text-align:center;
    width:min(400px,88vw)}
  .replay h3{margin:0 0 16px;font-size:24px;color:#4a3b28}
  .replay button{display:block;width:100%;margin:10px 0;border:0;border-radius:20px;
    padding:16px;font-size:20px;font-weight:800;background:#f2f6ee;color:#3c4a34;cursor:pointer}
  .replay button:active{transform:scale(.97)}
</style>
</head>
<body>
<div id="app">

  <!-- 1. 마을 -->
  <div class="scr" id="s-village">
    <div class="sky"></div>
    <div class="hill" style="width:70vw;height:34vh;left:-12vw;bottom:-16vh"></div>
    <div class="hill" style="width:80vw;height:38vh;right:-18vw;bottom:-20vh;background:#97cb78"></div>
    <div class="cloud" style="top:10%;animation-duration:42s">☁️</div>
    <div class="cloud" style="top:22%;animation-delay:-18s">☁️</div>
    <div style="position:absolute;left:6vw;bottom:8vh;font-size:44px">🌳</div>
    <div style="position:absolute;right:8vw;bottom:26vh;font-size:36px">🌷</div>
    <div id="eggSpot" style="position:absolute;left:50%;bottom:16vh;transform:translateX(-50%);
      text-align:center;cursor:pointer">
      <div class="sparkle" style="left:-30px;top:-16px">✨</div>
      <div class="sparkle" style="right:-26px;top:8px;animation-delay:.6s">✨</div>
      <div id="villageEgg"></div>
    </div>
    <div id="saniHome" class="hidden" style="position:absolute;right:14vw;bottom:20vh;text-align:center">
      <div style="font-size:74px">🏠</div>
    </div>
    <div id="saniInVillage" class="hidden"></div>
  </div>

  <!-- 2. 알 깨우기 -->
  <div class="scr hidden" id="s-egg">
    <div class="sky"></div>
    <div class="talk" id="eggTalk">어? 풀숲에 뭔가 있어!</div>
    <div class="egg" id="bigEgg"></div>
  </div>

  <!-- 3. 만지기 -->
  <div class="scr hidden" id="s-touch">
    <div class="sky"></div>
    <div class="talk" id="touchTalk">산이를 만져 봐!</div>
    <button class="nextbtn hidden" id="touchNext">다음 ▶</button>
  </div>

  <!-- 4. 길 그리기 -->
  <div class="scr hidden" id="s-trace">
    <div class="sky"></div>
    <div class="talk long" id="traceTalk">길을 그려 줄래?</div>
    <div id="traceWrap">
      <svg id="traceSvg" viewBox="0 0 100 100"></svg>
      <div class="house" id="traceHouse" style="right:-8%;bottom:-6%">🏠</div>
    </div>
  </div>

  <!-- 5. 냠냠 -->
  <div class="scr hidden" id="s-feed">
    <div class="sky"></div>
    <div class="talk long" id="feedTalk">배고파!</div>
    <div class="foods" id="foods"></div>
  </div>

  <!-- 6. 손잡기 -->
  <div class="scr hidden" id="s-hands">
    <div class="sky"></div>
    <div class="talk long" id="handsTalk"></div>
    <div class="tree" id="aTree"></div>
    <div class="block" id="saBlock"></div>
  </div>

  <!-- 7. 카드 -->
  <div class="scr hidden" id="s-card">
    <div class="sky"></div>
    <div class="card">
      <h2>산이와 나의 첫 카드</h2>
      <canvas id="cardCv" width="360" height="240"></canvas>
      <div class="cardwords" id="cardWords"></div>
    </div>
    <button class="nextbtn" id="cardNext">🎉 마을로!</button>
  </div>

  <button class="skip hidden" id="skipBtn">▶</button>
</div>

<script>
/* ================================================================
   글자마을 0차 — ㅅ 세로 자르기
   흐름: 마을 → 알 → 부화 → 만지기 → 길그리기 → 냠냠 → 손잡기 → 카드 → 입주
   ================================================================ */
const $ = id => document.getElementById(id);

/* ── 획순 데이터 (100×100 기준) ── */
const STROKES = {
  'ㅅ': ['M50,20 L26,82', 'M49,40 L74,82'],
  'ㅏ': ['M42,16 L42,84', 'M42,50 L68,50']
};

/* ── 음성 ── */
const player = new Audio();
function sayBuiltIn(t, done){
  try{ speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t); u.lang='ko-KR'; u.rate=.9;
    if(done) u.onend = done;
    speechSynthesis.speak(u);
  }catch(e){ if(done) done(); }
}
function say(t, key, done){
  if(!key) return sayBuiltIn(t, done);
  try{ speechSynthesis.cancel(); }catch(e){}
  player.pause();
  let fell = false;
  const fb = () => { if(fell) return; fell = true; sayBuiltIn(t, done); };
  player.onended = done || null;
  player.onerror = fb;
  player.src = 'assets/voice/' + key + '.mp3';
  player.play().catch(fb);
}

/* 말이 끝난 뒤에 다음으로 넘어감. 소리가 안 나와도 최대시간 뒤엔 반드시 진행 */
function sayGo(t, key, next, maxMs){
  let fired = false;
  const go = () => { if(fired) return; fired = true; next(); };
  say(t, key, () => setTimeout(go, 400));
  setTimeout(go, maxMs || 12000);
}

/* ── 효과음 (파일 없이 코드로) ── */
const AC = window.AudioContext ? new AudioContext() : null;
function beep(freq, dur, type, vol){
  if(!AC) return;
  if(AC.state === 'suspended') AC.resume();
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'sine'; o.frequency.value = freq;
  g.gain.value = vol || .15;
  g.gain.exponentialRampToValueAtTime(.001, AC.currentTime + dur);
  o.connect(g); g.connect(AC.destination);
  o.start(); o.stop(AC.currentTime + dur);
}
const sndCrack = () => { beep(180, .08, 'square', .2); setTimeout(() => beep(140, .1, 'square', .18), 60); };
const sndPop   = () => { beep(500, .12, 'triangle', .25); setTimeout(() => beep(760, .18, 'triangle', .22), 90); };
const sndStep  = () => beep(300 + Math.random()*80, .07, 'sine', .1);
const sndBoing = () => { beep(220, .16, 'sine', .2); setTimeout(() => beep(330, .12, 'sine', .15), 100); };

/* ── 캐릭터 그리기 ── */
function saniSVG(mood){
  // mood: '' | 'yum'(볼 빵빵) | 'open'(입 벌림)
  const mouth = mood === 'open'
    ? '<ellipse cx="50" cy="52" rx="7" ry="9" fill="#7a4a3a"/>'
    : mood === 'yum'
      ? '<path d="M43,52 Q50,58 57,52" stroke="#7a4a3a" stroke-width="3" fill="none" stroke-linecap="round"/>'
      : '<path d="M44,51 Q50,56 56,51" stroke="#7a4a3a" stroke-width="3" fill="none" stroke-linecap="round"/>';
  const cheeks = mood === 'yum'
    ? '<circle cx="34" cy="50" r="9" fill="#f4a9a0"/><circle cx="66" cy="50" r="9" fill="#f4a9a0"/>'
    : '<circle cx="36" cy="48" r="5" fill="#f4b9b0" opacity=".75"/><circle cx="64" cy="48" r="5" fill="#f4b9b0" opacity=".75"/>';
  return `<svg viewBox="0 0 100 100">
    <path d="${STROKES['ㅅ'][0]}" stroke="#5b8c4a" stroke-width="17" fill="none" stroke-linecap="round"/>
    <path d="${STROKES['ㅅ'][1]}" stroke="#5b8c4a" stroke-width="17" fill="none" stroke-linecap="round"/>
    <path d="M50,20 L26,82" stroke="#79ab63" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M49,40 L74,82" stroke="#79ab63" stroke-width="9" fill="none" stroke-linecap="round"/>
    <circle cx="43" cy="38" r="6.5" fill="#fff"/><circle cx="57" cy="38" r="6.5" fill="#fff"/>
    <circle cx="44.5" cy="39" r="3" fill="#333"/><circle cx="55.5" cy="39" r="3" fill="#333"/>
    ${cheeks}${mouth}
    <path d="M40,16 Q50,8 60,16" stroke="#5b8c4a" stroke-width="6" fill="none" stroke-linecap="round"/>
  </svg>`;
}
function treeSVG(){
  return `<svg viewBox="0 0 100 120">
    <circle cx="50" cy="18" r="17" fill="#79b95e"/>
    <circle cx="38" cy="26" r="11" fill="#8cc773"/>
    <circle cx="62" cy="26" r="11" fill="#8cc773"/>
    <path d="M50,22 L50,104" stroke="#8b6b47" stroke-width="12" stroke-linecap="round"/>
    <path d="M50,60 L78,60" stroke="#8b6b47" stroke-width="10" stroke-linecap="round"/>
    <circle cx="82" cy="58" r="9" fill="#8cc773"/>
    <circle cx="45" cy="44" r="4.5" fill="#fff"/><circle cx="55" cy="44" r="4.5" fill="#fff"/>
    <circle cx="46" cy="45" r="2.2" fill="#333"/><circle cx="54" cy="45" r="2.2" fill="#333"/>
    <path d="M45,52 Q50,56 55,52" stroke="#5e4429" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </svg>`;
}
function eggSVG(crack){
  // crack: 0~2 (금 가는 단계)
  const cracks = [
    '',
    '<path d="M40,55 L48,62 L44,72 L52,80" stroke="#b09a6c" stroke-width="2.5" fill="none"/>',
    `<path d="M40,55 L48,62 L44,72 L52,80" stroke="#b09a6c" stroke-width="2.5" fill="none"/>
     <path d="M62,40 L55,50 L63,58 L57,68" stroke="#b09a6c" stroke-width="2.5" fill="none"/>
     <path d="M35,78 L44,84 L40,92" stroke="#b09a6c" stroke-width="2.5" fill="none"/>`
  ][crack] || '';
  return `<svg viewBox="0 0 100 120" style="width:100%;overflow:visible">
    <ellipse cx="50" cy="64" rx="34" ry="44" fill="#fdf6e3" stroke="#e8d9b8" stroke-width="3"/>
    <circle cx="40" cy="48" r="5" fill="#efe3c2"/>
    <circle cx="60" cy="72" r="7" fill="#efe3c2"/>
    <circle cx="52" cy="34" r="4" fill="#efe3c2"/>
    ${cracks}
  </svg>`;
}

/* ── 색종이 ── */
function confetti(){
  const cols = ['#ff7a2f','#4c9bff','#25c26e','#f5a623','#ff5fa2'];
  for(let i = 0; i < 36; i++){
    const c = document.createElement('div'); c.className = 'confetti';
    c.style.left = Math.random()*100 + 'vw';
    c.style.background = cols[i % cols.length];
    document.body.appendChild(c);
    c.animate(
      [{transform:'translateY(0) rotate(0)', opacity:1},
       {transform:'translateY(110vh) rotate(' + 720*Math.random() + 'deg)', opacity:.9}],
      {duration:1700 + Math.random()*1300, easing:'ease-in'}
    ).onfinish = () => c.remove();
  }
}

/* ── 화면 전환 ── */
const SCREENS = ['s-village','s-egg','s-touch','s-trace','s-feed','s-hands','s-card'];
function show(id){
  SCREENS.forEach(s => $(s).classList.toggle('hidden', s !== id));
  $('skipBtn').classList.toggle('hidden', id === 's-village');
}

/* ── 저장 ── */
let state = {};
try{ state = JSON.parse(localStorage.getItem('gm-state') || '{}'); }catch(e){}
function save(){ try{ localStorage.setItem('gm-state', JSON.stringify(state)); }catch(e){} }

/* ================================================================
   1. 마을
   ================================================================ */
function enterVillage(){
  show('s-village');
  const done = !!state.sani;
  $('eggSpot').classList.toggle('hidden', done);
  $('saniHome').classList.toggle('hidden', !done);
  $('saniInVillage').classList.toggle('hidden', !done);
  if(done && !$('saniInVillage').innerHTML){
    const d = $('saniInVillage');
    d.className = 'sani idle';
    d.style.cssText = 'right:20vw;bottom:14vh;width:110px;height:110px';
    d.innerHTML = saniSVG('');
    d.onclick = openReplay;
  }
}
$('villageEgg').innerHTML = eggSVG(0);
$('eggSpot').onclick = () => { startEgg(); };

/* 다시 놀기 메뉴 (입주 후 산이를 누르면) */
function openReplay(){
  const el = document.createElement('div');
  el.className = 'replay';
  el.innerHTML = `<div class="box"><h3>산이랑 뭐 하고 놀까?</h3>
    <button data-g="trace">✏️ 길 그리기</button>
    <button data-g="feed">🍎 냠냠 놀이</button>
    <button data-g="hands">🌳 손잡기</button>
    <button data-g="x" style="background:#fff;color:#999">닫기</button></div>`;
  document.body.appendChild(el);
  el.onclick = e => { if(e.target === el) el.remove(); };
  el.querySelectorAll('button').forEach(b => b.onclick = () => {
    el.remove();
    const g = b.dataset.g;
    if(g === 'trace') startTrace(true);
    else if(g === 'feed') startFeed(true);
    else if(g === 'hands') startHands(true);
  });
}

/* ================================================================
   2. 알 깨우기  — 문지르면 금이 가고, 펑!
   ================================================================ */
let rub = 0, eggStage = 0, hatched = false;
function startEgg(){
  rub = 0; eggStage = 0; hatched = false;
  $('bigEgg').innerHTML = eggSVG(0);
  $('bigEgg').className = 'egg';
  $('eggTalk').textContent = '어? 풀숲에 뭔가 있어! 문질러 볼까?';
  show('s-egg');
  say('어? 풀숲에 뭔가 있어! 문질러 볼까?', 'n_egg');
}
(function bindEgg(){
  const egg = $('bigEgg');
  let down = false, lx = 0, ly = 0;
  egg.addEventListener('pointerdown', e => {
    down = true; lx = e.clientX; ly = e.clientY;
    egg.setPointerCapture(e.pointerId);
  });
  egg.addEventListener('pointermove', e => {
    if(!down || hatched) return;
    rub += Math.hypot(e.clientX - lx, e.clientY - ly);
    lx = e.clientX; ly = e.clientY;
    if(eggStage === 0 && rub > 150){ eggStage = 1; egg.innerHTML = eggSVG(1); egg.classList.add('excited'); sndCrack(); }
    if(eggStage === 1 && rub > 340){ eggStage = 2; egg.innerHTML = eggSVG(2); sndCrack(); }
    if(eggStage === 2 && rub > 520){ hatch(); }
  });
  egg.addEventListener('pointerup', () => { down = false; });
})();
function hatch(){
  hatched = true;
  sndPop(); confetti();
  const egg = $('bigEgg');
  egg.className = '';
  egg.innerHTML = `<div class="sani idle" style="position:relative;width:min(40vh,260px);height:min(40vh,260px);margin:0 auto">${saniSVG('')}</div>`;
  $('eggTalk').textContent = '산처럼 뾰족한 친구네! 이름은 산이야';
  let went = false;
  const go = () => { if(went) return; went = true; startTouch(); };
  say('짜잔! 나는 산이라고 해!', 's_hello',
    () => setTimeout(() =>
      sayGo('산처럼 뾰족한 친구네! 이름은 산이야.', 'n_born', go, 12000), 300));
  setTimeout(go, 20000);
}

/* ================================================================
   3. 만지기 — 끌면 스스스, 두 번 두드리면 산으로 변신
   ================================================================ */
let touchCount = 0;
function startTouch(){
  show('s-touch');
  $('touchTalk').textContent = '산이를 만져 봐!';
  touchCount = 0;
  $('touchNext').classList.add('hidden');
  const scr = $('s-touch');
  scr.querySelectorAll('.sani').forEach(x => x.remove());
  const d = document.createElement('div');
  d.className = 'sani idle';
  d.id = 'touchSani';
  d.style.cssText = 'left:calc(50% - 90px);top:calc(50% - 90px);width:180px;height:180px';
  d.innerHTML = saniSVG('');
  scr.appendChild(d);
  bindTouchSani(d);
  say('산이를 만져 봐! 끌어도 보고, 톡톡 두드려도 봐.', 'n_touch');
}
function bindTouchSani(d){
  let drag = false, ox = 0, oy = 0, lastSay = 0, lastTap = 0;
  d.addEventListener('pointerdown', e => {
    drag = true;
    ox = e.clientX - d.offsetLeft; oy = e.clientY - d.offsetTop;
    d.setPointerCapture(e.pointerId);
    d.classList.remove('idle');
    // 두 번 두드리기 → 산으로 변신
    const now = performance.now();
    if(now - lastTap < 350) transformSani(d);
    lastTap = now;
    touched();
  });
  d.addEventListener('pointermove', e => {
    if(!drag) return;
    d.style.left = (e.clientX - ox) + 'px';
    d.style.top  = (e.clientY - oy) + 'px';
    const now = performance.now();
    if(now - lastSay > 900){ lastSay = now;
      const k = ['s_sss','s_sss1','s_sss2'][Math.floor(Math.random()*3)];
      say('스스스스.', k); }
  });
  d.addEventListener('pointerup', () => {
    drag = false;
    d.classList.add('wob');
    setTimeout(() => { d.classList.remove('wob'); d.classList.add('idle'); }, 520);
    sndBoing();
  });
}
function transformSani(d){
  d.innerHTML = '<div style="font-size:130px;text-align:center;line-height:180px">⛰️</div>';
  say('짜잔! 나는 산이라고 해!', 's_mount');
  setTimeout(() => { d.innerHTML = saniSVG(''); }, 1400);
  touched();
}
function touched(){
  touchCount++;
  if(touchCount >= 3) $('touchNext').classList.remove('hidden');
}
$('touchNext').onclick = () => startTrace(false);

/* ================================================================
   4. 길 그리기 — ㅅ 획순을 따라 그리면 길이 되고 산이가 걷는다
   ================================================================ */
let tr = null, replayMode = false;
function startTrace(replay){
  replayMode = !!replay;
  show('s-trace');
  $('traceTalk').textContent = '산이가 집에 가고 싶대. 길을 그려 줄래?';
  const svg = $('traceSvg');
  svg.innerHTML = '';
  tr = { stroke:0, drawing:false, saved: state.strokes ? [] : [] };
  tr.saved = [];

  STROKES['ㅅ'].forEach(d => {
    const p = document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d', d); p.setAttribute('class','guide');
    svg.appendChild(p);
  });
  tr.ink = document.createElementNS('http://www.w3.org/2000/svg','path');
  tr.ink.setAttribute('class','drawink');
  svg.appendChild(tr.ink);
  tr.dot = document.createElementNS('http://www.w3.org/2000/svg','circle');
  tr.dot.setAttribute('class','startdot pulse');
  tr.dot.setAttribute('r','6');
  svg.appendChild(tr.dot);

  // 산이 (작게, 시작점에)
  const wrap = $('traceWrap');
  wrap.querySelectorAll('.sani').forEach(x => x.remove());
  tr.sani = document.createElement('div');
  tr.sani.className = 'sani';
  tr.sani.style.cssText = 'width:64px;height:64px;pointer-events:none';
  tr.sani.innerHTML = saniSVG('');
  wrap.appendChild(tr.sani);

  say('힝, 집에 가고 싶은데, 대신 길을 그려 줄래?', 's_home');
  prepStroke();
}
function svgPt(x, y){
  const r = $('traceSvg').getBoundingClientRect();
  return { x:(x - r.left)/r.width*100, y:(y - r.top)/r.height*100 };
}
function placeSani(wx, wy){
  const r = $('traceSvg').getBoundingClientRect(), w = $('traceWrap').getBoundingClientRect();
  tr.sani.style.left = (r.left - w.left + wx/100*r.width - 32) + 'px';
  tr.sani.style.top  = (r.top  - w.top  + wy/100*r.height - 56) + 'px';
}
function prepStroke(){
  const svg = $('traceSvg');
  const probe = document.createElementNS('http://www.w3.org/2000/svg','path');
  probe.setAttribute('d', STROKES['ㅅ'][tr.stroke]);
  probe.style.visibility = 'hidden';
  svg.appendChild(probe);
  const len = probe.getTotalLength();
  const N = Math.max(22, Math.round(len));
  tr.pts = []; tr.hit = new Array(N).fill(false);
  for(let i = 0; i < N; i++) tr.pts.push(probe.getPointAtLength(len*i/(N-1)));
  probe.remove();
  tr.dot.setAttribute('cx', tr.pts[0].x);
  tr.dot.setAttribute('cy', tr.pts[0].y);
  tr.dot.style.display = '';
  tr.trail = [];
  tr.ink.setAttribute('d','');
  tr.lock = false;                         // 다음 획 그리기 허용
  placeSani(tr.pts[0].x, tr.pts[0].y);
}
(function bindTrace(){
  const svg = $('traceSvg');
  svg.addEventListener('pointerdown', e => {
    if(!tr) return;
    e.preventDefault();
    tr.drawing = true; tr.trail = [];
    svg.setPointerCapture(e.pointerId);
    markTrace(svgPt(e.clientX, e.clientY));
  });
  svg.addEventListener('pointermove', e => {
    if(!tr || !tr.drawing) return;
    e.preventDefault();
    markTrace(svgPt(e.clientX, e.clientY));
  });
  const end = () => {
    if(!tr || !tr.drawing) return;
    tr.drawing = false;
    const cov = tr.hit.filter(Boolean).length / tr.hit.length;
    if(cov < .7){
      tr.ink.setAttribute('d','');
      tr.hit.fill(false);
      $('traceTalk').textContent = '한 번 더! 빨간 점부터 그려 봐';
    }
  };
  svg.addEventListener('pointerup', end);
  svg.addEventListener('pointercancel', end);
})();
function markTrace(p){
  if(tr.lock) return;                      // 완성 처리 중에는 무시
  tr.trail.push(p);
  tr.ink.setAttribute('d', 'M' + tr.trail.map(q => q.x.toFixed(1)+','+q.y.toFixed(1)).join(' L'));
  tr.pts.forEach((q, i) => {
    if(!tr.hit[i] && Math.hypot(q.x - p.x, q.y - p.y) < 16) tr.hit[i] = true;
  });
  if(tr.hit.filter(Boolean).length / tr.hit.length >= .7) strokeDone();
}
function strokeDone(){
  tr.lock = true;                          // 산이가 걷는 동안 잠금
  tr.drawing = false;
  tr.saved.push(tr.trail.slice());
  tr.ink.setAttribute('d','');
  const svg = $('traceSvg');
  const road = document.createElementNS('http://www.w3.org/2000/svg','path');
  road.setAttribute('d', STROKES['ㅅ'][tr.stroke]);
  road.setAttribute('class','roadink');
  svg.insertBefore(road, tr.ink);
  tr.dot.style.display = 'none';
  walkAlong(tr.pts, () => {
    tr.stroke++;
    if(tr.stroke < STROKES['ㅅ'].length){
      $('traceTalk').textContent = '길이 생겼다! 다음 길도 그려 줘';
      prepStroke();
    } else {
      $('traceTalk').textContent = '집에 도착했다! 🎉';
      state.strokes = tr.saved.map(s => s.map(p => [Math.round(p.x), Math.round(p.y)]));
      save();
      sayGo('고마워! 네 덕분에 집에 왔어!', 's_thanks',
        () => { replayMode ? enterVillage() : startFeed(false); }, 10000);
    }
  });
}
function walkAlong(pts, done){
  let i = 0, fin = false;
  const step = () => {
    if(i >= pts.length){ if(!fin){ fin = true; done(); } return; }
    placeSani(pts[i].x, pts[i].y);
    if(i % 5 === 0) sndStep();
    i += 2;
    requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
  setTimeout(() => {                       // 애니메이션이 멈춘 화면 대비
    if(fin) return; fin = true;
    placeSani(pts[pts.length-1].x, pts[pts.length-1].y);
    done();
  }, 3000);
}

/* ================================================================
   5. 냠냠 — ㅅ으로 시작하는 것만 먹는다
   ================================================================ */
const FOOD_Q = [
  { e:'🍎', n:'사과',  ok:true },
  { e:'🍌', n:'바나나', ok:false },
  { e:'🍉', n:'수박',  ok:true },
  { e:'🍇', n:'포도',  ok:false },
  { e:'🍬', n:'사탕',  ok:true },
  { e:'🥛', n:'우유',  ok:false }
];
let feed = null;
function startFeed(replay){
  replayMode = !!replay;
  show('s-feed');
  feed = { eaten:0, qi:3, words:[] };
  $('feedTalk').textContent = '배고파! 나는 스— 소리로 시작하는 것만 먹어!';
  const scr = $('s-feed');
  scr.querySelectorAll('.sani').forEach(x => x.remove());
  feed.sani = document.createElement('div');
  feed.sani.className = 'sani idle';
  feed.sani.style.cssText = 'left:calc(50% - 100px);top:20%;width:200px;height:200px;pointer-events:none';
  feed.sani.innerHTML = saniSVG('open');
  scr.appendChild(feed.sani);

  const box = $('foods'); box.innerHTML = '';
  FOOD_Q.slice(0,3).forEach(f => box.appendChild(mkFood(f)));
  say('배고파! 나는 스, 소리로 시작하는 것만 먹어!', 's_hungry');
}
function mkFood(f){
  const d = document.createElement('div');
  d.className = 'food';
  d.innerHTML = `<div class="fe">${f.e}</div><div class="fn">${f.n}</div>`;
  let drag = false, sx = 0, sy = 0;
  d.addEventListener('pointerdown', e => {
    e.preventDefault();
    drag = true; sx = e.clientX; sy = e.clientY;
    d.classList.add('drag');
    d.setPointerCapture(e.pointerId);
  });
  d.addEventListener('pointermove', e => {
    if(!drag) return;
    d.style.transform = 'translate(' + (e.clientX - sx) + 'px,' + (e.clientY - sy) + 'px)';
  });
  d.addEventListener('pointerup', e => {
    drag = false; d.classList.remove('drag');
    const s = feed.sani.getBoundingClientRect();
    const inMouth = e.clientX > s.left && e.clientX < s.right && e.clientY > s.top && e.clientY < s.bottom + 30;
    if(inMouth) eatFood(f, d);
    else d.style.transform = '';
  });
  d.addEventListener('pointercancel', () => { drag = false; d.classList.remove('drag'); d.style.transform = ''; });
  return d;
}
function eatFood(f, el){
  el.remove();
  if(f.ok){
    feed.eaten++; feed.words.push(f.n);
    feed.sani.innerHTML = saniSVG('yum');
    feed.sani.classList.add('cheek');
    setTimeout(() => feed.sani.classList.remove('cheek'), 1300);
    say(f.n + '! 정답이야!', 'w_' + f.n);
    setTimeout(() => feed.sani.innerHTML = saniSVG('open'), 1500);
  } else {
    say('우웩! 이건 아니야!', 's_yuck');
    // 뱉기: 음식이 포물선으로 날아감
    const fly = document.createElement('div');
    fly.className = 'roll';
    fly.textContent = f.e;
    fly.style.left = '50%'; fly.style.top = '30%';
    $('s-feed').appendChild(fly);
    fly.animate(
      [{transform:'translate(0,0) rotate(0)'},
       {transform:'translate(38vw,50vh) rotate(540deg)', opacity:.6}],
      {duration:900, easing:'ease-in'}
    ).onfinish = () => fly.remove();
  }
  // 다음 음식 채우기
  if(feed.qi < FOOD_Q.length){
    $('foods').appendChild(mkFood(FOOD_Q[feed.qi]));
    feed.qi++;
  }
  if(feed.eaten >= 3){
    state.words = feed.words; save();
    $('feedTalk').textContent = '꺼억! 잘 먹었다!';
    sayGo('꺼억! 잘 먹었다! 정말 고마워!', 's_burp',
      () => { replayMode ? enterVillage() : startHands(false); }, 10000);
  }
}

/* ================================================================
   6. 손잡기 — 산이(ㅅ) + ㅏ나무 = 사!
   ================================================================ */
let hands = null;
function startHands(replay){
  replayMode = !!replay;
  show('s-hands');
  $('handsTalk').textContent = '';
  const scr = $('s-hands');
  scr.querySelectorAll('.sani').forEach(x => x.remove());
  $('saBlock').classList.remove('on');
  $('saBlock').innerHTML = '';

  const tree = $('aTree');
  tree.innerHTML = treeSVG();
  tree.style.right = '16vw'; tree.style.top = '30%';

  hands = { done:false };
  hands.sani = document.createElement('div');
  hands.sani.className = 'sani idle';
  hands.sani.style.cssText = 'left:12vw;top:40%;width:150px;height:150px';
  hands.sani.innerHTML = saniSVG('');
  scr.appendChild(hands.sani);
  bindHandsSani(hands.sani);

  $('handsTalk').textContent = '안녕! 나는 아— 하고 소리 나는 나무야';
  say('안녕! 나는 아, 하고 소리 나는 나무야.', 'a_intro',
    () => say('산이야, 내 손 잡아 볼래?', 'a_intro2',
      () => { $('handsTalk').textContent = '산이를 나무에게 데려다 줘!'; }));
}
function bindHandsSani(d){
  let drag = false, ox = 0, oy = 0;
  d.addEventListener('pointerdown', e => {
    if(hands.done) return;
    drag = true;
    ox = e.clientX - d.offsetLeft; oy = e.clientY - d.offsetTop;
    d.setPointerCapture(e.pointerId);
    d.classList.remove('idle');
  });
  d.addEventListener('pointermove', e => {
    if(!drag) return;
    d.style.left = (e.clientX - ox) + 'px';
    d.style.top  = (e.clientY - oy) + 'px';
  });
  d.addEventListener('pointerup', () => {
    drag = false;
    if(hands.done) return;
    const a = d.getBoundingClientRect(), t = $('aTree').getBoundingClientRect();
    const dist = Math.hypot(
      (a.left + a.width/2) - (t.left + t.width/2),
      (a.top + a.height/2) - (t.top + t.height/2));
    if(dist < 160) joinHands();
    else d.classList.add('idle');
  });
}
function joinHands(){
  hands.done = true;
  sndPop();
  // 글자 블록: ㅅ(왼쪽) + ㅏ(오른쪽) = 사
  const block = $('saBlock');
  block.style.left = 'calc(50% - 100px)';
  block.style.top = 'calc(42% - 100px)';
  block.innerHTML = `<svg viewBox="0 0 100 100">
    <g transform="translate(-16,4) scale(.72)">
      <path d="${STROKES['ㅅ'][0]}" stroke="#5b8c4a" stroke-width="13" fill="none" stroke-linecap="round"/>
      <path d="${STROKES['ㅅ'][1]}" stroke="#5b8c4a" stroke-width="13" fill="none" stroke-linecap="round"/>
    </g>
    <g transform="translate(34,4) scale(.72)">
      <path d="${STROKES['ㅏ'][0]}" stroke="#8b6b47" stroke-width="13" fill="none" stroke-linecap="round"/>
      <path d="${STROKES['ㅏ'][1]}" stroke="#8b6b47" stroke-width="13" fill="none" stroke-linecap="round"/>
    </g>
  </svg>`;
  hands.sani.style.transition = 'all .5s';
  hands.sani.style.left = 'calc(50% - 170px)';
  $('handsTalk').textContent = '사!';
  block.classList.add('on');
  say('사!', 'sa', () => say("이건 '사'라고 해!", 'n_sa2', () => {
    // 사과가 데굴데굴
    const ap = document.createElement('div');
    ap.className = 'roll';
    ap.textContent = '🍎';
    ap.style.left = 'calc(50% + 60px)'; ap.style.top = '55%';
    $('s-hands').appendChild(ap);
    ap.animate(
      [{transform:'translate(0,0) rotate(0)'},
       {transform:'translate(-30vw,12vh) rotate(-720deg)'}],
      {duration:1400, easing:'ease-out', fill:'forwards'});
    sayGo('사과의, 사!', 'n_sa',
      () => { replayMode ? enterVillage() : startCard(); }, 9000);
  }));
}

/* ================================================================
   7. 카드 — 내가 그린 ㅅ + 먹인 낱말
   ================================================================ */
function startCard(){
  show('s-card');
  const cv = $('cardCv'), g = cv.getContext('2d');
  g.clearRect(0, 0, cv.width, cv.height);
  // 내가 그린 획 (저장된 좌표)
  g.strokeStyle = '#f0a050'; g.lineWidth = 14; g.lineCap = 'round'; g.lineJoin = 'round';
  const sx = x => 30 + x/100*180, sy = y => 20 + y/100*200;
  (state.strokes || []).forEach(s => {
    g.beginPath();
    s.forEach((p, i) => i ? g.lineTo(sx(p[0]), sy(p[1])) : g.moveTo(sx(p[0]), sy(p[1])));
    g.stroke();
  });
  // 산이 얼굴 (오른쪽)
  g.font = '80px serif'; g.fillText('⛰️', 240, 150);
  g.font = 'bold 26px sans-serif'; g.fillStyle = '#5b8c4a';
  g.fillText('산이', 252, 190);
  $('cardWords').textContent = '오늘 먹은 것: ' + (state.words || []).join(', ');
  say('우와, 멋진 카드가 됐어! 엄마 아빠한테 보여줄까?', 'n_card');
}
$('cardNext').onclick = () => moveIn();

/* ================================================================
   8. 입주식
   ================================================================ */
function moveIn(){
  state.sani = true; save();
  enterVillage();
  confetti(); sndPop();
  say('산이가 글자마을에 이사 왔어!', 'n_movein',
    () => say('앞으로도 산이를 잘 부탁해!', 's_comeagain'));
}

/* ── 건너뛰기 (부모·테스트용) ── */
const FLOW = ['s-egg','s-touch','s-trace','s-feed','s-hands','s-card'];
$('skipBtn').onclick = () => {
  const cur = SCREENS.find(s => !$(s).classList.contains('hidden'));
  const i = FLOW.indexOf(cur);
  if(cur === 's-card') moveIn();
  else if(i >= 0){
    const nxt = FLOW[i + 1];
    if(nxt === 's-touch') { hatched = true; startTouch(); }
    else if(nxt === 's-trace') startTrace(false);
    else if(nxt === 's-feed') startFeed(false);
    else if(nxt === 's-hands') startHands(false);
    else if(nxt === 's-card') startCard();
  }
};

/* ── 시작 ── */
enterVillage();
</script>
