<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="세계여행">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#a9d9f0">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="icon" type="image/png" sizes="512x512" href="assets/icon-512.png">
<link rel="manifest" href="manifest.json">
<title>세계 여행 - 나라와 수도</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;
    font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    user-select:none;-webkit-user-select:none;background:#e9f3fa;color:#1e2530;touch-action:none}
  #app{position:relative;height:100%;overflow:hidden}
  .hidden{display:none!important}

  /* ── 상단 (지도 위에 얹힘) ── */
  /* z-index 18 — 놀이 화면(15)보다 위에 있어야 '그만하기' 버튼을 누를 수 있습니다 */
  .top{position:absolute;top:env(safe-area-inset-top);left:0;right:0;z-index:18;
    height:60px;display:flex;align-items:center;gap:10px;padding:0 14px;pointer-events:none}
  .top > *{pointer-events:auto}
  .title{font-size:20px;font-weight:800;background:rgba(255,255,255,.82);
    border-radius:20px;padding:7px 15px;box-shadow:0 2px 8px rgba(0,0,0,.13)}
  .sp{flex:1}
  .tbtn{background:#fff;color:#41506a;border:0;border-radius:22px;padding:10px 18px;
    font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 3px 9px rgba(0,0,0,.13)}
  .tbtn.hot{background:#ffb01f;color:#fff;box-shadow:0 4px 11px rgba(255,176,31,.45)}
  .tbtn:active{transform:scale(.94)}
  .stars{font-size:17px;font-weight:800;color:#f5a623}

  /* ── 지도 ── */
  #mapScreen{position:absolute;inset:0;min-height:0}
  .stagebox{position:absolute;inset:0;overflow:hidden;background:#a9d9f0}
  #map{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
  #map.drag{cursor:grabbing}

  /* 국기는 그림만 담당하고, 누르는 판정은 지도가 통합 처리합니다 */
  .pin{position:absolute;left:0;top:0;z-index:3;will-change:transform;pointer-events:none}
  .pin .in{display:block;position:relative;transform:translate(-50%,-50%);
    transition:transform .18s cubic-bezier(.2,1.5,.5,1)}
  .pin.sel{z-index:9}
  .pin.sel .in{transform:translate(-50%,-50%) scale(1.32)}
  .pin img{width:30px;height:22px;object-fit:cover;display:block;
    box-shadow:0 0 0 2px #fff, 0 2px 6px rgba(0,0,0,.35);background:#fff}
  /* 나라 이름은 국기 오른쪽에 */
  .pin b{position:absolute;left:19px;top:50%;transform:translateY(-50%);
    font-size:12px;font-weight:800;color:#2c3b52;white-space:nowrap;
    background:rgba(255,255,255,.88);border-radius:8px;padding:2px 7px;
    box-shadow:0 1px 3px rgba(0,0,0,.15);
    opacity:0;transition:opacity .15s;pointer-events:none}
  .pin.named b,.pin.sel b{opacity:1}

  /* 대륙 · 바다 · 극지 이름 */
  .place{position:absolute;left:0;top:0;z-index:2;will-change:transform;pointer-events:none;
    white-space:nowrap;font-weight:900;letter-spacing:1px}
  .place span{display:block;transform:translate(-50%,-50%);transition:transform .15s}
  .place.sel span{transform:translate(-50%,-50%) scale(1.15)}
  .place.대륙 span{font-size:19px;color:#5f8a45;text-shadow:0 1px 0 rgba(255,255,255,.75)}
  .place.바다 span{font-size:18px;color:#4e91b8;font-style:italic;
    text-shadow:0 1px 0 rgba(255,255,255,.6)}
  .place.극지 span{font-size:17px;color:#7d95a8;text-shadow:0 1px 0 rgba(255,255,255,.8)}

  .zoomhint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);
    background:rgba(255,255,255,.9);border-radius:16px;padding:6px 14px;
    font-size:13px;font-weight:700;color:#5b6678;pointer-events:none;transition:opacity .4s}
  .reset{position:absolute;right:12px;bottom:12px;background:#fff;border:0;border-radius:20px;
    padding:10px 16px;font-size:15px;font-weight:800;color:#41506a;cursor:pointer;
    box-shadow:0 3px 10px rgba(0,0,0,.2);z-index:5}

  /* ── 나라 카드 ── */
  .sheet{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;
    padding:20px;background:rgba(18,28,42,0);transition:background .26s}
  .sheet.on{background:rgba(18,28,42,.45)}
  .card{background:#fff;width:min(560px,94vw);max-height:88vh;overflow:auto;
    border-radius:30px;padding:26px 26px 24px;text-align:center;
    box-shadow:0 20px 50px rgba(10,20,40,.35);
    opacity:0;transform:scale(.85);
    transition:transform .3s cubic-bezier(.2,1.35,.4,1), opacity .2s}
  .sheet.on .card{opacity:1;transform:scale(1)}
  .card .bigflag{width:170px;height:114px;margin:0 auto 12px;display:block;
    object-fit:cover;box-shadow:0 5px 14px rgba(0,0,0,.22)}
  .cname{font-size:32px;font-weight:900;line-height:1.15}
  .cen{font-size:15px;color:#8a95a6;margin-bottom:10px}
  .huge{font-size:58px;margin:2px 0 12px}
  .placeemo{font-size:92px;line-height:1.05;margin:2px 0 6px}
  .tapme{cursor:pointer;transition:transform .12s}
  .tapme:active{transform:scale(.94)}
  .facts{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
  .fact{display:flex;align-items:center;gap:11px;background:#f4f7fb;border-radius:16px;
    padding:12px 15px;font-size:18px;font-weight:700;text-align:left;cursor:pointer;
    transition:background .12s, transform .12s}
  .fact:active{background:#e3ecf7;transform:scale(.97)}
  .fact.playing{background:#dceeff;box-shadow:inset 0 0 0 2px #7cc0ff}
  .fact .k{font-size:23px;flex:none}
  .fact .v{flex:1}
  .fact .spk{font-size:19px;flex:none;opacity:.55}
  .crow{display:flex;gap:11px}
  .crow button{flex:1;border:0;border-radius:22px;padding:15px;font-size:18px;font-weight:800;cursor:pointer}
  .primary{background:#2e9bff;color:#fff}
  .ghost{background:#eef1f6;color:#5b6678}

  /* ── 놀이 고르기 ── */
  #menuScreen{position:fixed;inset:0;z-index:25;background:rgba(18,28,42,0);
    display:flex;align-items:center;justify-content:center;padding:20px;transition:background .25s}
  #menuScreen.on{background:rgba(18,28,42,.5)}
  .menucard{background:#fff;border-radius:30px;padding:26px 24px;width:min(620px,94vw);
    max-height:90vh;overflow:auto;text-align:center;box-shadow:0 20px 50px rgba(10,20,40,.35);
    opacity:0;transform:scale(.86);transition:transform .3s cubic-bezier(.2,1.35,.4,1),opacity .2s}
  #menuScreen.on .menucard{opacity:1;transform:scale(1)}
  .menucard h2{font-size:26px;margin:0 0 18px}
  .games{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-bottom:18px}
  .game{width:min(170px,42vw);background:#f4f7fb;border:0;border-radius:24px;padding:20px 10px;
    cursor:pointer;font-family:inherit}
  .game:active{transform:scale(.95)}
  .game .ico{font-size:52px;line-height:1.1}
  .game .nm{font-size:19px;font-weight:800;margin-top:8px;color:#2a3547}
  .game .dsc{font-size:13px;color:#8a95a6;margin-top:3px;font-weight:600}

  /* ── 짝 맞추기 ── */
  #matchScreen{position:absolute;inset:0;z-index:15;background:#eaf3fb;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;padding:calc(env(safe-area-inset-top) + 74px) 14px 18px;overflow:auto}
  .mgrid{display:grid;gap:10px}
  .mcard{position:relative;aspect-ratio:4/3;border-radius:14px;cursor:pointer;
    background:#2e9bff;box-shadow:0 4px 10px rgba(0,0,0,.16);overflow:hidden}
  .mcard .q{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:30px;color:#fff;transition:opacity .2s}
  .mcard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    opacity:0;transition:opacity .2s}
  .mcard.up img,.mcard.done img{opacity:1}
  .mcard.up .q,.mcard.done .q{opacity:0}
  .mcard.done{box-shadow:0 0 0 4px #25c26e}
  .mcard.up{box-shadow:0 0 0 4px #ffb01f}

  /* ── 지도에서 찾기 ── */
  #findBar{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 68px);
    transform:translateX(-50%);z-index:11;background:rgba(255,255,255,.94);
    border-radius:22px;padding:12px 22px;box-shadow:0 4px 14px rgba(0,0,0,.18);
    font-size:20px;font-weight:800;white-space:nowrap;display:flex;align-items:center;gap:12px}
  #findBar .n{color:#2e9bff}
  #findBar small{font-size:14px;color:#8a95a6;font-weight:700}
  .wrongflash{position:fixed;inset:0;z-index:35;background:rgba(255,90,90,.28);
    pointer-events:none;animation:fadeout .5s forwards}
  @keyframes fadeout{to{opacity:0}}

  /* ── 색깔 찾기 ── */
  #colorScreen{position:absolute;inset:0;z-index:15;background:#eaf3fb;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;padding:calc(env(safe-area-inset-top) + 74px) 14px 18px;overflow:auto}
  .cq{font-size:clamp(20px,4.4vw,28px);font-weight:800;text-align:center;line-height:1.4}
  .cq .sw{font-size:1.3em;vertical-align:-3px}
  .cgrid{display:grid;grid-template-columns:repeat(3, min(190px,28vw));gap:14px}
  .cflag{position:relative;border-radius:14px;overflow:hidden;cursor:pointer;
    box-shadow:0 4px 10px rgba(0,0,0,.16)}
  .cflag img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
  .cflag.got{box-shadow:0 0 0 5px #25c26e;transform:scale(1.04)}
  .cflag.got::after{content:'✓';position:absolute;right:6px;top:2px;font-size:26px;color:#25c26e;
    text-shadow:0 1px 3px #fff,0 0 6px #fff}
  .cflag.bad{animation:shake .45s}

  /* ── 동물 지도 ── */
  .animal{position:absolute;left:0;top:0;z-index:4;will-change:transform;pointer-events:none;
    font-size:34px;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.35))}
  .animal span{display:block;transform:translate(-50%,-50%);transition:transform .15s}
  .animal.sel span{transform:translate(-50%,-50%) scale(1.3)}

  /* ── 여권 (도장 모으기) ── */
  #passScreen{position:absolute;inset:0;z-index:15;background:#fdf8ee;overflow:auto;
    padding:calc(env(safe-area-inset-top) + 74px) 16px 28px}
  .passhead{text-align:center;margin-bottom:6px}
  .passhead .big{font-size:26px;font-weight:900;color:#6b5a35}
  .passhead .sub{color:#a08a5e;font-size:15px;font-weight:700;margin-top:4px}
  .pbar{height:14px;border-radius:8px;background:#eadfc6;max-width:420px;margin:12px auto 0;overflow:hidden}
  .pbar i{display:block;height:100%;background:#ffb01f;border-radius:8px;transition:width .5s}
  .pgroup{margin:22px 0 8px;font-size:17px;font-weight:800;color:#a08a5e}
  .pgroup b{color:#6b5a35}
  .pgrid{display:flex;flex-wrap:wrap;gap:10px}
  .ptile{position:relative;width:min(96px,20vw);cursor:pointer}
  .ptile img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;
    box-shadow:0 2px 6px rgba(0,0,0,.22)}
  .ptile .nm{font-size:12px;font-weight:700;margin-top:4px;color:#5b4f3a;line-height:1.25}
  .ptile.no img{filter:grayscale(1);opacity:.22}
  .ptile.no .nm{color:#c3b79f}
  .ptile .st{position:absolute;right:-5px;top:-7px;font-size:19px;
    filter:drop-shadow(0 1px 2px rgba(0,0,0,.3))}
  .ptile:active{transform:scale(.94)}

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(18px);
    background:#2a3547;color:#fff;border-radius:24px;padding:13px 24px;font-size:17px;
    font-weight:800;z-index:50;opacity:0;transition:all .25s;pointer-events:none}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

  .todaytag{display:inline-block;background:#ffb01f;color:#fff;font-size:15px;font-weight:800;
    border-radius:16px;padding:5px 15px;margin-bottom:10px}

  /* ── 놀이 ── */
  #quizScreen{position:absolute;inset:0;z-index:15;background:#eaf3fb;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:18px;padding:calc(env(safe-area-inset-top) + 74px) 20px 24px;min-height:0;overflow:auto}
  .prog{font-size:16px;color:#7b8798;font-weight:700}
  .qsub{font-size:72px;line-height:1}
  .qtext{font-size:28px;font-weight:800;text-align:center;line-height:1.35}
  .opts{display:flex;gap:20px;flex-wrap:wrap;justify-content:center}
  .opt{width:min(180px,26vw);padding:11px;border-radius:20px;background:#fff;border:5px solid transparent;
    cursor:pointer;box-shadow:0 5px 14px rgba(0,0,0,.13)}
  .opt img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
  .opt.ok{border-color:#25c26e;background:#eafbf1;transform:scale(1.06)}
  .opt.no{animation:shake .45s}
  .bigbtn{border:0;border-radius:26px;padding:16px 30px;font-size:20px;font-weight:800;
    cursor:pointer;box-shadow:0 5px 14px rgba(0,0,0,.18)}
  .bigbtn.go{background:#ffb01f;color:#fff}
  .bigbtn.back{background:#fff;color:#5b6678}
  .bigbtn:active{transform:scale(.95)}
  @keyframes shake{25%{transform:translateX(-11px)}75%{transform:translateX(11px)}}
  .confetti{position:fixed;top:-30px;width:13px;height:19px;border-radius:3px;pointer-events:none;z-index:60}

  /* 정답을 맞혔을 때 국기를 크게 보여주는 화면 */
  .answer{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
    background:rgba(238,247,255,0);transition:background .22s;pointer-events:none}
  .answer.on{background:rgba(238,247,255,.94)}
  .abox{text-align:center;opacity:0;transform:scale(.55);
    transition:transform .34s cubic-bezier(.2,1.5,.4,1), opacity .2s}
  .answer.on .abox{opacity:1;transform:scale(1)}
  .abox img{width:min(330px,64vw);aspect-ratio:4/3;object-fit:cover;display:block;margin:0 auto 18px;
    box-shadow:0 12px 32px rgba(0,0,0,.3)}
  .abox b{font-size:clamp(30px,7vw,46px);font-weight:900;display:block}
  .abox .ok{font-size:20px;color:#25c26e;font-weight:800;margin-top:8px;display:block}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="title" id="title">🌍 세계 여행</div>
    <div class="sp"></div>
    <div class="stars" id="starcount"></div>
    <button class="tbtn hot" id="menuBtn">🎮 놀이</button>
    <button class="tbtn hidden" id="mapBtn">✕ 그만하기</button>
  </div>

  <div id="mapScreen">
    <div class="stagebox" id="stagebox">
      <canvas id="map"></canvas>
      <div class="zoomhint" id="zoomhint">손가락 두 개로 늘리면 커져요 · 나라를 눌러보세요</div>
      <button class="reset hidden" id="resetBtn">🌍 전체보기</button>
    </div>
    <div id="findBar" class="hidden"><span id="findText"></span><small id="findProg"></small></div>
  </div>

  <div id="menuScreen" class="hidden">
    <div class="menucard">
      <h2>🎮 무슨 놀이 할까요?</h2>
      <div class="games">
        <button class="game" data-g="quiz"><div class="ico">🚩</div>
          <div class="nm">국기 맞히기</div><div class="dsc">듣고 국기 고르기</div></button>
        <button class="game" data-g="match"><div class="ico">🃏</div>
          <div class="nm">짝 맞추기</div><div class="dsc">같은 국기 찾기</div></button>
        <button class="game" data-g="find"><div class="ico">🔎</div>
          <div class="nm">지도에서 찾기</div><div class="dsc">나라 위치 찾기</div></button>
        <button class="game" data-g="color"><div class="ico">🎨</div>
          <div class="nm">색깔 찾기</div><div class="dsc">국기 색 고르기</div></button>
        <button class="game" data-g="animal"><div class="ico">🐾</div>
          <div class="nm">동물 찾기</div><div class="dsc">지도에서 동물</div></button>
        <button class="game" data-g="pass"><div class="ico">🎫</div>
          <div class="nm">내 여권</div><div class="dsc">모은 도장 보기</div></button>
      </div>
      <div class="crow"><button class="ghost" id="menuClose">닫기</button></div>
    </div>
  </div>

  <div id="matchScreen" class="hidden">
    <div class="prog" id="mprog"></div>
    <div class="mgrid" id="mgrid"></div>
  </div>

  <div id="colorScreen" class="hidden">
    <div class="prog" id="cprog"></div>
    <div class="cq" id="cq"></div>
    <div class="cgrid" id="cgrid"></div>
  </div>

  <div id="passScreen" class="hidden">
    <div class="passhead">
      <div class="big" id="passCount"></div>
      <div class="sub">나라를 눌러보면 도장이 찍혀요</div>
      <div class="pbar"><i id="passBar"></i></div>
    </div>
    <div id="passBody"></div>
  </div>

  <div class="toast" id="toast"></div>

  <div id="quizScreen" class="hidden">
    <div class="prog" id="qprog"></div>
    <div class="qsub" id="qsub"></div>
    <div class="qtext" id="qtext"></div>
    <div class="opts" id="qopts"></div>
  </div>
</div>

<script src="assets/world-paths.js"></script>
<script src="assets/countries.js"></script>
<script src="assets/extra.js"></script>
<script src="assets/places.js"></script>
<script src="assets/flagcolors.js"></script>
<script>
/* ===== 자동 업데이트 =====
   앱을 열 때마다 version.json 을 확인합니다. 번호가 달라졌으면 저장해 둔 파일을
   비우고 한 번만 새로고침해서 새 내용을 받아옵니다. (인터넷이 없으면 그냥 넘어감) */
if('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){
  navigator.serviceWorker.register('sw.js').catch(() => {});
  fetch('version.json', { cache:'no-store' })
    .then(r => r.json())
    .then(async info => {
      const seen = localStorage.getItem('wm-ver');
      if(seen && seen !== info.v && !sessionStorage.getItem('wm-reloaded')){
        sessionStorage.setItem('wm-reloaded', '1');
        localStorage.setItem('wm-ver', info.v);
        const reg = await navigator.serviceWorker.getRegistration();
        if(reg && reg.active) reg.active.postMessage('clear');
        setTimeout(() => location.reload(), 400);
        return;
      }
      localStorage.setItem('wm-ver', info.v);
    })
    .catch(() => {});
}

const $ = id => document.getElementById(id);
const BY = new Map(COUNTRIES.map(c => [c.id, c]));
const flagSrc = c => 'assets/flags/' + c.cc + '.svg';
let stars = +(localStorage.getItem('wm-stars') || 0);

/* 미리 만들어 둔 음성 파일(assets/voice)이 있으면 그걸 쓰고,
   없으면 기기의 기본 목소리로 읽어 줍니다. */
const player = new Audio();

function sayBuiltIn(t, l, done){
  try{ speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t);
    u.lang = l || 'ko-KR'; u.rate = 0.85;
    if(done) u.onend = done;
    speechSynthesis.speak(u);
  }catch(e){ if(done) done(); }
}
function say(t, l, key, done){
  if(!key) return sayBuiltIn(t, l, done);
  try{ speechSynthesis.cancel(); }catch(e){}
  player.pause();

  let fell = false;
  const fallback = () => { if(fell) return; fell = true; sayBuiltIn(t, l, done); };
  player.onended = done || null;
  player.onerror = fallback;                 // 음성 파일이 없으면 기본 목소리로
  player.src = 'assets/voice/' + key + '.mp3';
  player.play().catch(fallback);
}
// 여러 문장을 차례로 읽어 줍니다
function sayAll(list, i){
  i = i || 0;
  if(i >= list.length) return;
  const s = list[i];
  say(s.text, s.lang, s.key, () => setTimeout(() => sayAll(list, i + 1), 250));
}

/* 한국어 조사 붙이기 (받침이 있으면 은/이에요, 없으면 는/예요) */
function hasJong(w){
  const c = w.charCodeAt(w.length - 1);
  return c >= 0xAC00 && c <= 0xD7A3 && (c - 0xAC00) % 28 !== 0;
}
const eunNeun = w => w + (hasJong(w) ? '은' : '는');
const ieyo    = w => w + (hasJong(w) ? '이에요' : '예요');
const eulReul = w => w + (hasJong(w) ? '을' : '를');
function drawStars(){ $('starcount').textContent = stars ? '⭐ ' + stars : ''; }

/* ================= 지도 (canvas) ================= */
const box = $('stagebox'), cv = $('map'), ctx = cv.getContext('2d');
const DPR = Math.min(2, window.devicePixelRatio || 1);

// 나라 모양을 Path2D 로 미리 만들어 둔다 (매번 다시 해석하지 않도록)
const SHAPES = WORLD.map(w => ({ id: w.id, path: new Path2D(w.d), fb: w.fb }));

const COL = { sea:'#a9d9f0', land:'#cfe8b8', line:'#8fbc72', sel:'#ffd166', selLine:'#dd9c22' };

/* 카메라 —  x,y = 화면 왼쪽 위가 가리키는 세계 좌표,  s = 세계 1칸이 몇 픽셀인지.
   화면이 가로로 길든 세로로 길든 똑같이 동작합니다. */
const cam = { x:0, y:0, s:1 };
let selected = null;
let BW = 0, BH = 0;

function measure(){
  BW = box.clientWidth; BH = box.clientHeight;
  cv.width = Math.max(1, Math.round(BW * DPR));
  cv.height = Math.max(1, Math.round(BH * DPR));
}
const fitScale = () => Math.min(BW/360, BH/180) || 1;   // 세계 전체가 들어가는 크기
const zoom = () => cam.s / fitScale();                  // 몇 배로 확대했는지

function clampCam(){
  const min = fitScale();
  cam.s = Math.min(min * 40, Math.max(min, cam.s));
  const vw = BW/cam.s, vh = BH/cam.s;
  cam.x = vw >= 360 ? (360 - vw)/2 : Math.min(360 - vw, Math.max(0, cam.x));
  cam.y = vh >= 180 ? (180 - vh)/2 : Math.min(180 - vh, Math.max(0, cam.y));
}
function resetCam(){ cam.s = fitScale(); cam.x = 0; cam.y = 0; clampCam(); }

function drawMap(){
  const s = cam.s * DPR;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = COL.sea;
  ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(s, 0, 0, s, -cam.x * s, -cam.y * s);
  ctx.lineJoin = 'round';
  ctx.lineWidth = 0.7 / s * DPR;              // 확대해도 선 굵기 그대로
  ctx.strokeStyle = COL.line;
  const vw = BW/cam.s, vh = BH/cam.s;
  for(const sh of SHAPES){
    const f = sh.fb;                            // 화면 밖 나라는 건너뛴다
    if(f[2] < cam.x || f[0] > cam.x + vw || f[3] < cam.y || f[1] > cam.y + vh) continue;
    const on = sh.id === selected;
    ctx.fillStyle = on ? COL.sel : COL.land;
    ctx.fill(sh.path);
    if(on){ ctx.strokeStyle = COL.selLine; ctx.lineWidth = 1.6 / s * DPR; }
    ctx.stroke(sh.path);
    if(on){ ctx.strokeStyle = COL.line; ctx.lineWidth = 0.7 / s * DPR; }
  }
}

const pins = new Map();
COUNTRIES.forEach(c => {
  const p = document.createElement('div');
  p.className = 'pin';
  p.innerHTML = '<span class="in"><img src="' + flagSrc(c) + '" alt="' + c.ko + '"><b>' + c.ko + '</b></span>';
  if(QUIZ_CC.indexOf(c.cc) >= 0) p.dataset.feat = '1';   // 잘 알려진 나라는 항상 보이게
  box.appendChild(p);
  pins.set(c.id, p);
});

/* 이름표를 붙일 순서 — 소개글 있는 나라 먼저, 그다음 큰 나라부터.
   자리를 먼저 차지한 이름이 이기고, 겹치는 이름은 숨겨서 지도가 지저분해지지 않게 한다. */
const LABEL_ORDER = COUNTRIES.slice().sort((a, b) => {
  const fa = QUIZ_CC.indexOf(a.cc) >= 0 ? 1 : 0, fb = QUIZ_CC.indexOf(b.cc) >= 0 ? 1 : 0;
  if(fa !== fb) return fb - fa;
  const wa = a.b ? (a.b[2]-a.b[0]) : 0, wb = b.b ? (b.b[2]-b.b[0]) : 0;
  return wb - wa;
}).map(c => c.id);

/* 대륙 · 바다 · 극지 이름표 */
const places = new Map();
PLACES.forEach(pl => {
  const d = document.createElement('div');
  d.className = 'place ' + pl.kind;
  d.innerHTML = '<span>' + pl.ko + '</span>';
  box.appendChild(d);
  places.set(pl.id, d);
});
const PLACE_BY = new Map(PLACES.map(p => [p.id, p]));

function render(){
  clampCam();
  if(!BW) measure();
  drawMap();
  const z = zoom();
  places.forEach((d, id) => {
    const pl = PLACE_BY.get(id);
    const sx = (pl.p[0] - cam.x) * cam.s, sy = (pl.p[1] - cam.y) * cam.s;
    const w = d.firstChild.offsetWidth / 2 + 6, h = 16;
    // 글자가 화면 밖으로 잘리면 아예 감춥니다
    const out = sx - w < 2 || sy - h < 2 || sx + w > BW - 2 || sy + h > BH - 2;
    d.style.display = out ? 'none' : '';
    if(!out){ d._sx = sx; d._sy = sy;
      d.style.transform = 'translate3d(' + sx.toFixed(1) + 'px,' + sy.toFixed(1) + 'px,0)'; }
  });
  pins.forEach((p, id) => {
    const c = BY.get(id);
    const sx = (c.p[0] - cam.x) * cam.s, sy = (c.p[1] - cam.y) * cam.s;
    const out = sx < 16 || sy < 14 || sx > BW - 16 || sy > BH - 14;
    const wide = c.b ? (c.b[2] - c.b[0]) * cam.s : 0;
    const show = !animalMode && !out
      && (p.dataset.feat === '1' || wide >= 34 || z >= 2.2 || id === selected);
    if(!show){ if(p.style.display !== 'none') p.style.display = 'none'; return; }
    if(p.style.display === 'none') p.style.display = '';
    p._sx = sx; p._sy = sy;                       // 국기 누름 판정에 씀
    p.style.transform = 'translate3d(' + sx.toFixed(1) + 'px,' + sy.toFixed(1) + 'px,0)';
  });
  animals.forEach((d, id) => {                 // 동물 찾기 모드일 때만 보임
    if(!animalMode){ d.classList.add('hidden'); return; }
    const c = BY.get(id);
    const sx = (c.p[0] - cam.x) * cam.s, sy = (c.p[1] - cam.y) * cam.s;
    const out = sx < 18 || sy < 18 || sx > BW - 18 || sy > BH - 18;
    d.classList.toggle('hidden', out);
    if(!out){ d._sx = sx; d._sy = sy;
      d.style.transform = 'translate3d(' + sx.toFixed(1) + 'px,' + sy.toFixed(1) + 'px,0)'; }
  });
  placeLabels();
  $('resetBtn').classList.toggle('hidden', z < 1.15);
}

function placeLabels(){
  const taken = [];                               // 이미 자리를 차지한 영역들
  const overlap = (r) => {
    for(const t of taken)
      if(r[0] < t[2] && r[2] > t[0] && r[1] < t[3] && r[3] > t[1]) return true;
    return false;
  };
  // 국기 자체는 무조건 자리를 차지한다 (이름이 다른 국기를 가리지 않게)
  pins.forEach(p => {
    if(p.style.display === 'none') return;
    taken.push([p._sx - 16, p._sy - 12, p._sx + 16, p._sy + 12]);
  });
  for(const id of LABEL_ORDER){
    const p = pins.get(id);
    if(!p || p.style.display === 'none'){ if(p) p.classList.remove('named'); continue; }
    const w = BY.get(id).ko.length * 12 + 16, h = 18;
    const r = [p._sx + 18, p._sy - h/2, p._sx + 18 + w, p._sy + h/2];
    if(r[2] > BW || overlap(r)){ p.classList.remove('named'); continue; }
    taken.push(r);
    p.classList.add('named');
  }
}

/* 손가락이 움직일 때마다 그리면 렉이 걸린다. 화면 새로고침에 맞춰 한 번만 그린다. */
let pending = false;
function scheduleRender(){
  if(pending) return;
  pending = true;
  const run = () => { if(!pending) return; pending = false; render(); };
  requestAnimationFrame(run);
  setTimeout(run, 100);                         // 애니메이션이 멈춘 화면 대비
}

let anim = null, animEnd = null;
function flyTo(tx, ty, ts, ms){
  if(anim) cancelAnimationFrame(anim);
  if(animEnd) clearTimeout(animEnd);
  if(typeof stopGlide === 'function') stopGlide();
  const from = { ...cam }, t0 = performance.now(), dur = ms || 520;
  let done = false;
  (function step(now){
    const r = Math.min(1, (now - t0) / dur);
    const e = 1 - Math.pow(1 - r, 3);
    cam.x = from.x + (tx - from.x) * e;
    cam.y = from.y + (ty - from.y) * e;
    cam.s = from.s + (ts - from.s) * e;
    render();
    if(r < 1) anim = requestAnimationFrame(step); else done = true;
  })(performance.now());
  animEnd = setTimeout(() => {                  // 애니메이션이 멈춰도 목적지에 도착하게
    if(done) return;
    if(anim) cancelAnimationFrame(anim);
    cam.x = tx; cam.y = ty; cam.s = ts; render();
  }, dur + 80);
}
/* ================= 손가락 조작 ================= */
const ptrs = new Map();
let startDist = 0, startK = 1, startMid = null, moved = 0, downAt = 0;
let vX = 0, vY = 0, lastMoveT = 0, glideAnim = null;

function stopGlide(){ if(glideAnim) cancelAnimationFrame(glideAnim); glideAnim = null; }

/* 손을 뗀 뒤 관성으로 조금 더 미끄러지게 (딱 멈추면 답답하게 느껴짐) */
function glide(){
  stopGlide();
  if(performance.now() - lastMoveT > 90) return;   // 멈춘 채로 뗐으면 미끄러지지 않음
  let vx = vX, vy = vY, prev = performance.now();
  (function step(now){
    const dt = Math.min(40, now - prev); prev = now;
    cam.x -= vx * dt; cam.y -= vy * dt;
    const f = Math.pow(0.94, dt / 16);             // 마찰
    vx *= f; vy *= f;
    clampCam(); render();
    if(Math.hypot(vx, vy) > 0.0008) glideAnim = requestAnimationFrame(step);
    else glideAnim = null;
  })(performance.now());
}

function worldAt(clientX, clientY){
  const r = box.getBoundingClientRect();
  return { x: cam.x + (clientX - r.left) / cam.s,
           y: cam.y + (clientY - r.top)  / cam.s };
}
// 국기를 눌렀는지 먼저 본다 (국기 주변 넉넉하게 인정 — 아이 손가락 기준)
function pinAt(clientX, clientY){
  const r = box.getBoundingClientRect();
  const x = clientX - r.left, y = clientY - r.top;
  let best = null, bd = 28;
  pins.forEach((p, id) => {
    if(p.style.display === 'none' || p._sx === undefined) return;
    const d = Math.hypot(p._sx - x, p._sy - y);
    if(d < bd){ bd = d; best = id; }
  });
  return best;
}

// 대륙·바다 이름을 눌렀는지 (글자 범위 안이면 인정)
function placeAt(clientX, clientY){
  for(const [id, d] of places){
    if(d.style.display === 'none') continue;
    const r = d.firstChild.getBoundingClientRect();
    if(clientX >= r.left - 6 && clientX <= r.right + 6 &&
       clientY >= r.top - 8 && clientY <= r.bottom + 8) return id;
  }
  return null;
}

// 화면에서 누른 곳이 어느 나라인지 (canvas 도형으로 직접 판정)
function countryAt(clientX, clientY){
  const r = box.getBoundingClientRect();
  const px = (clientX - r.left) * DPR, py = (clientY - r.top) * DPR;
  const s = cam.s * DPR;
  ctx.setTransform(s, 0, 0, s, -cam.x * s, -cam.y * s);
  for(let i = SHAPES.length - 1; i >= 0; i--){
    if(ctx.isPointInPath(SHAPES[i].path, px, py)) return SHAPES[i].id;
  }
  return null;
}

box.addEventListener('pointerdown', e => {
  stopGlide();
  ptrs.set(e.pointerId, { x:e.clientX, y:e.clientY });
  box.setPointerCapture(e.pointerId);
  moved = 0; downAt = performance.now(); lastMoveT = downAt; vX = vY = 0;
  cv.classList.add('drag');
  if(ptrs.size === 2){
    const [a,b] = [...ptrs.values()];
    startDist = Math.hypot(a.x-b.x, a.y-b.y); startK = cam.s;
    startMid = worldAt((a.x+b.x)/2, (a.y+b.y)/2);
  }
});
box.addEventListener('pointermove', e => {
  if(!ptrs.has(e.pointerId)) return;
  const prev = ptrs.get(e.pointerId);
  const dx = e.clientX - prev.x, dy = e.clientY - prev.y;
  ptrs.set(e.pointerId, { x:e.clientX, y:e.clientY });
  moved += Math.hypot(dx, dy);
  if(anim) cancelAnimationFrame(anim);

  if(ptrs.size === 2 && startDist){
    const [a,b] = [...ptrs.values()];
    cam.s = startK * (Math.hypot(a.x-b.x, a.y-b.y) / startDist);
    clampCam();
    const mid = worldAt((a.x+b.x)/2, (a.y+b.y)/2);
    cam.x += startMid.x - mid.x; cam.y += startMid.y - mid.y;
  } else if(ptrs.size === 1){
    const wdx = dx / cam.s, wdy = dy / cam.s;
    cam.x -= wdx; cam.y -= wdy;
    const now = performance.now();                 // 미끄러짐에 쓸 속도 기록
    const gap = Math.max(8, now - lastMoveT);
    vX = wdx / gap; vY = wdy / gap; lastMoveT = now;
  }
  scheduleRender();
});
box.addEventListener('pointerup', e => {
  const wasTap = moved < 9 && performance.now() - downAt < 450 && ptrs.size === 1;
  ptrs.delete(e.pointerId);
  if(ptrs.size < 2) startDist = 0;
  if(!ptrs.size) cv.classList.remove('drag');
  if(wasTap){
    const an = animalAt(e.clientX, e.clientY);
    if(an){ selectCountry(an); return; }
    if(animalMode) return;                       // 동물 찾기 중에는 동물만 반응
    const pin = pinAt(e.clientX, e.clientY);
    const pl  = pin ? null : placeAt(e.clientX, e.clientY);
    const id  = pin || (pl ? null : countryAt(e.clientX, e.clientY));
    if(pl) selectPlace(pl);
    else if(id && BY.has(id)) selectCountry(id);
  } else glide();                                  // 손을 떼면 미끄러지듯 이어서
});
box.addEventListener('pointercancel', e => { ptrs.delete(e.pointerId); startDist = 0; });
box.addEventListener('wheel', e => {                 // 컴퓨터에서 확인용
  e.preventDefault();
  const before = worldAt(e.clientX, e.clientY);
  cam.s *= e.deltaY < 0 ? 1.15 : 1/1.15;
  clampCam();
  const after = worldAt(e.clientX, e.clientY);
  cam.x += before.x - after.x; cam.y += before.y - after.y;
  scheduleRender();
}, { passive:false });

$('resetBtn').onclick = () => {
  clearSel();
  const s = fitScale(), vw = BW/s, vh = BH/s;
  flyTo((360-vw)/2, (180-vh)/2, s);
};
window.addEventListener('resize', () => { measure(); render(); });

/* ================= 나라 고르기 ================= */
function clearSel(){
  places.forEach(d => d.classList.remove('sel'));
  if(!selected) return;
  const pin = pins.get(selected); if(pin) pin.classList.remove('sel');
  selected = null;
  render();
}

/* 대륙 · 바다 · 극지 고르기 */
function selectPlace(id){
  if(findOn) return;                            // 찾기 놀이 중에는 대륙·바다 무시
  clearSel();
  places.get(id).classList.add('sel');
  $('zoomhint').style.opacity = 0;
  openPlaceCard(PLACE_BY.get(id));
}
function selectCountry(id){
  if(findOn) return checkFind(id);              // 찾기 놀이 중에는 정답 확인만
  if(selected){ const o = pins.get(selected); if(o) o.classList.remove('sel'); }
  selected = id;
  pins.get(id).classList.add('sel');
  $('zoomhint').style.opacity = 0;
  render();                                   // 고른 나라를 노란색으로 표시
  openCard(BY.get(id));                       // 확대·이동 없이 정보만
}

/* 나라 카드와 대륙·바다 카드가 함께 쓰는 틀 */
function showCard(head, title, sub, emo, lines, name){
  const el = document.createElement('div');
  el.className = 'sheet';
  el.innerHTML = `
    <div class="card">
      ${head}
      <div class="cname">${title}</div>
      <div class="cen">${sub}</div>
      ${emo ? '<div class="huge">' + emo + '</div>' : ''}
      <div class="facts">${lines.map((l,i) =>
        '<div class="fact" data-i="'+i+'"><span class="k">'+l.k+'</span>'
        + '<span class="v">'+l.html+'</span><span class="spk">🔊</span></div>').join('')}</div>
      <div class="crow">
        <button class="ghost" data-close>닫기</button>
        <button class="primary" data-read>🔊 다 들려주기</button>
      </div>
    </div>`;
  document.body.appendChild(el);
  setTimeout(() => el.classList.add('on'), 16);

  // 국기(또는 큰 그림)를 누르면 이름을 다시 불러 줍니다
  const head0 = el.querySelector('.bigflag, .placeemo');
  if(head0){
    head0.classList.add('tapme');
    head0.onclick = () => say(name.text, 'ko-KR', name.key);
  }

  const rows = [...el.querySelectorAll('.fact')];
  const mark = i => rows.forEach((r, n) => r.classList.toggle('playing', n === i));
  rows.forEach((row, i) => row.onclick = () => {
    mark(i);
    const l = lines[i];
    say(l.text, l.lang || 'ko-KR', l.key, () => mark(-1));
  });

  // 팝업과 정보가 다 뜬 다음에 이름을 불러 줍니다
  const nameTimer = setTimeout(() => say(name.text, 'ko-KR', name.key), 420);

  el.querySelector('[data-read]').onclick = () => sayAll([name, ...lines]);
  const close = () => {
    clearTimeout(nameTimer);
    try{ player.pause(); speechSynthesis.cancel(); }catch(e){}
    el.classList.remove('on'); setTimeout(() => el.remove(), 320); clearSel();
  };
  el.querySelector('[data-close]').onclick = close;
  el.onclick = e => { if(e.target === el) close(); };
}

function openCard(c){
  const x = EXTRA[c.cc];
  addStamp(c);                                    // 여권에 도장
  const lines = [
    { k:'🏛️', html:'수도는 <b>'+c.cap+'</b>',
      key:'cap_'+c.cc,  text:`${c.ko}의 수도는 ${ieyo(c.cap)}` },
    { k:'🌏', html:c.cont+'에 있어요',
      key:'cont_'+c.cc, text:`${eunNeun(c.ko)} ${c.cont}에 있어요` }
  ];

    { k:'👋', html:'인사말 <b>'+x.hi+'</b>', key:'hi_'+c.cc, text:x.hi, lang:x.hl });
  if(x) lines.push(
    { k:'✨', html:x.fact, key:'fact_'+c.cc, text:`${eunNeun(c.ko)} ${x.fact}` });

  showCard(`<img class="bigflag" src="${flagSrc(c)}" alt="${c.ko} 국기">`,

function openPlaceCard(pl){

  if(name === 'mapScreen'){ measure(); render(); }
}

/* ===== 놀이 고르기 ===== */
function openMenu(){
  $('menuScreen').classList.remove('hidden');
  setTimeout(() => $('menuScreen').classList.add('on'), 16);
}
function closeMenu(){
  $('menuScreen').classList.remove('on');
  setTimeout(() => $('menuScreen').classList.add('hidden'), 260);
}
$('menuBtn').onclick   = openMenu;
$('menuClose').onclick = closeMenu;
$('menuScreen').onclick = e => { if(e.target === $('menuScreen')) closeMenu(); };
document.querySelectorAll('.game').forEach(b => b.onclick = () => {
  closeMenu();
  const go = { quiz: startQuiz, match: startMatch, find: startFind,
               color: startColor, animal: startAnimal, pass: openPassport }[b.dataset.g];
  setTimeout(go, 280);
});
$('mapBtn').onclick = () => { endFind(); endAnimal(); showScreen('mapScreen', '🌍 세계 여행'); };

function startQuiz(){
  qList = shuffle([...QUIZ_POOL]).slice(0,5); qNo = 0;
  showScreen('quizScreen', '🚩 국기 맞히기');
  nextQ();
}

/* ===== 색깔 찾기 ===== */
const COLOR_STRONG = 5, COLOR_NONE = 1;      // 5% 이상이면 '있다', 1% 미만이면 '없다'
let cRound = 0, cLeft = 0, cLock = false;

function startColor(){ cRound = 0; showScreen('colorScreen', '🎨 색깔 찾기'); nextColor(); }

function nextColor(){
  if(cRound >= 3) return colorDone();
  const col = pick(PLAY_COLORS);
  const has = c => (FLAGCOLOR[c.cc] || {})[col.ko] || 0;
  const yes = shuffle(COUNTRIES.filter(c => has(c) >= COLOR_STRONG)).slice(0, 3);
  const no  = shuffle(COUNTRIES.filter(c => has(c) < COLOR_NONE)).slice(0, 3);
  if(yes.length < 3 || no.length < 3) return nextColor();      // 보기가 모자라면 다른 색으로

  cLeft = yes.length; cLock = false;
  $('cprog').textContent = (cRound + 1) + ' / 3';
  $('cq').innerHTML = '<span class="sw">' + col.em + '</span> <b>' + col.adj
    + '</b>이 들어간 국기를<br>모두 찾아보세요';
  say(col.adj + '이 들어간 국기를 모두 찾아보세요', 'ko-KR', 'color_' + col.ko);

  const all = shuffle([...yes, ...no]);
  const g = $('cgrid');
  g.innerHTML = all.map((c, i) =>
    '<div class="cflag" data-i="' + i + '"><img src="' + flagSrc(c) + '" alt=""></div>').join('');
  [...g.children].forEach(el => el.onclick = () => {
    if(cLock) return;
    const c = all[+el.dataset.i];
    if(el.classList.contains('got')) return;
    if(has(c) >= COLOR_STRONG){
      el.classList.add('got');
      say(c.ko, 'ko-KR', 'name_' + c.cc);
      if(--cLeft === 0){ cLock = true; cRound++; setTimeout(nextColor, 1300); }
    } else {
      el.classList.add('bad');
      setTimeout(() => el.classList.remove('bad'), 500);
    }
  });
}
function colorDone(){
  stars++; localStorage.setItem('wm-stars', stars); drawStars();
  $('cprog').textContent = '';
  $('cq').innerHTML = '🎉 다 찾았어요!<br>⭐ 별을 하나 받았어요';
  const g = $('cgrid');
  g.style.gridTemplateColumns = '1fr';
  g.innerHTML = '<button class="bigbtn go" id="cAgain">🎨 한 번 더</button>'
              + '<button class="bigbtn back" id="cDone">🌍 지도로</button>';
  $('cAgain').onclick = () => { g.style.gridTemplateColumns = ''; startColor(); };
  $('cDone').onclick  = () => { g.style.gridTemplateColumns = ''; $('mapBtn').onclick(); };
  say('참 잘했어요! 별을 하나 받았어요', 'ko-KR', 'praise');
  confetti();
}

/* ===== 동물 찾기 (지도 위) ===== */
const ANIMAL_EMO = new Set(['🐘','🐼','🦎','🐫','🐊','🦧','🐠','🐅','🐉','🦁','🐈','🐴','🦌',
  '🐻','🦬','🐦','🐢','🦍','🦋','🐟','🦜','🐄','🦥','🐷','🦘','🐑','🐬','🐋','🪼','🐒','🦒',
  '🐪','🐎','🦙','🐧','🐆','🐝']);
const ANIMAL_LIST = COUNTRIES.filter(c => EXTRA[c.cc] && ANIMAL_EMO.has(EXTRA[c.cc].emo));
const animals = new Map();
ANIMAL_LIST.forEach(c => {
  const d = document.createElement('div');
  d.className = 'animal hidden';
  d.innerHTML = '<span>' + EXTRA[c.cc].emo + '</span>';
  box.appendChild(d);
  animals.set(c.id, d);
});
let animalMode = false;

function startAnimal(){
  animalMode = true;
  showScreen('mapScreen', '🐾 동물 찾기');
  $('menuBtn').classList.add('hidden'); $('mapBtn').classList.remove('hidden');
  $('findBar').classList.remove('hidden');
  $('findText').innerHTML = '<span class="n">동물</span>을 눌러보세요';
  $('findProg').textContent = ANIMAL_LIST.length + '마리';
  $('zoomhint').style.opacity = 0;
  resetCam(); render();
  say('동물을 눌러보세요', 'ko-KR', 'animalfind');
}
function endAnimal(){
  if(!animalMode) return;
  animalMode = false;
  animals.forEach(d => d.classList.add('hidden'));
  $('findBar').classList.add('hidden');
  render();
}
// 동물을 눌렀는지
function animalAt(clientX, clientY){
  if(!animalMode) return null;
  const r = box.getBoundingClientRect();
  const x = clientX - r.left, y = clientY - r.top;
  let best = null, bd = 30;
  animals.forEach((d, id) => {
    if(d.classList.contains('hidden') || d._sx === undefined) return;
    const dist = Math.hypot(d._sx - x, d._sy - y);
    if(dist < bd){ bd = dist; best = id; }
  });
  return best;
}

/* ===== 여권 (도장 모으기) ===== */
const CONT_ORDER = ['아시아','유럽','아프리카','북아메리카','중앙아메리카',
                    '카리브해','남아메리카','오세아니아'];
let visited = new Set(JSON.parse(localStorage.getItem('wm-visited') || '[]'));

function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('on'), 1900);
}

// 나라 카드를 열면 도장이 찍힙니다
function addStamp(c){
  if(visited.has(c.cc)) return;
  visited.add(c.cc);
  localStorage.setItem('wm-visited', JSON.stringify([...visited]));

  const same = COUNTRIES.filter(x => x.cont === c.cont);
  const got  = same.filter(x => visited.has(x.cc)).length;
  if(got === same.length){
    toast('🎉 ' + c.cont + ' 도장을 다 모았어요!');
    setTimeout(() => say('우와! 이 대륙을 다 모았어요', 'ko-KR', 'stampall'), 2600);
  } else {
    toast('🎫 도장을 받았어요!  (' + visited.size + ' / ' + COUNTRIES.length + ')');
  }
}

function openPassport(){
  const total = COUNTRIES.length, got = visited.size;
  $('passCount').textContent = '🎫 ' + got + ' / ' + total + ' 나라를 여행했어요';
  $('passBar').style.width = Math.round(got / total * 100) + '%';

  const groups = {};
  for(const c of COUNTRIES) (groups[c.cont] = groups[c.cont] || []).push(c);
  const names = Object.keys(groups).sort(
    (a, b) => CONT_ORDER.indexOf(a) - CONT_ORDER.indexOf(b));

  $('passBody').innerHTML = names.map(g => {
    const list = groups[g].slice().sort((a, b) => a.ko.localeCompare(b.ko, 'ko'));
    const n = list.filter(c => visited.has(c.cc)).length;
    return '<div class="pgroup">' + g + ' <b>' + n + ' / ' + list.length + '</b>'
      + (n === list.length ? ' 🏆' : '') + '</div><div class="pgrid">'
      + list.map(c => '<div class="ptile' + (visited.has(c.cc) ? '' : ' no')
        + '" data-cc="' + c.cc + '"><img src="' + flagSrc(c) + '" alt="">'
        + (visited.has(c.cc) ? '<span class="st">🎫</span>' : '')
        + '<div class="nm">' + c.ko + '</div></div>').join('')
      + '</div>';
  }).join('');

  $('passBody').querySelectorAll('.ptile').forEach(t => t.onclick = () => {
    const c = COUNTRIES.find(x => x.cc === t.dataset.cc);
    if(visited.has(c.cc)) say(c.ko, 'ko-KR', 'name_' + c.cc);
    else toast('아직 안 가봤어요 — 지도에서 눌러보세요');
  });

  showScreen('passScreen', '🎫 내 여권');
}

/* ===== 오늘의 나라 ===== */
function todayCountry(){
  const d = new Date();
  const key = '' + d.getFullYear() + (d.getMonth()+1) + d.getDate();
  if(localStorage.getItem('wm-today') === key) return;   // 하루에 한 번만
  localStorage.setItem('wm-today', key);

  let h = 0;
  for(let i = 0; i < key.length; i++) h = (h * 31 + key.charCodeAt(i)) % 100000;
  const c = COUNTRIES[h % COUNTRIES.length];
  const x = EXTRA[c.cc];

  const el = document.createElement('div');
  el.className = 'sheet';
  el.innerHTML = `
    <div class="card">
      <div class="todaytag">오늘의 나라</div>
      <img class="bigflag tapme" src="${flagSrc(c)}" alt="${c.ko} 국기">
      <div class="cname">${c.ko}</div>
      <div class="cen">${c.en}</div>
      <div class="huge">${x ? x.emo : '🌍'}</div>
      <div class="facts">
        <div class="fact"><span class="k">🏛️</span><span class="v">수도는 <b>${c.cap}</b></span></div>
        ${x ? '<div class="fact"><span class="k">✨</span><span class="v">' + x.fact + '</span></div>' : ''}
      </div>
      <div class="crow">
        <button class="ghost" data-close>닫기</button>
        <button class="primary" data-go>🌍 보러가기</button>
      </div>
    </div>`;
  document.body.appendChild(el);
  setTimeout(() => el.classList.add('on'), 16);

  const close = () => { el.classList.remove('on'); setTimeout(() => el.remove(), 320); };
  el.querySelector('.bigflag').onclick = () => say(c.ko, 'ko-KR', 'name_' + c.cc);
  el.querySelector('[data-close]').onclick = close;
  el.querySelector('[data-go]').onclick = () => { close(); setTimeout(() => selectCountry(c.id), 340); };
  el.onclick = e => { if(e.target === el) close(); };

  setTimeout(() => say(c.ko, 'ko-KR', 'name_' + c.cc,
    () => setTimeout(() => say('오늘의 나라예요', 'ko-KR', 'today'), 200)), 500);
}

/* ===== 짝 맞추기 ===== */
let mOpen = [], mLock = false, mLeft = 0, mCards = [];
function startMatch(){
  const six = shuffle([...QUIZ_POOL]).slice(0, 6);
  mCards = shuffle([...six, ...six]);
  mOpen = []; mLock = false; mLeft = six.length;
  const g = $('mgrid');
  g.style.gridTemplateColumns = 'repeat(4, min(150px, 21vw))';
  g.innerHTML = mCards.map((c, i) =>
    '<div class="mcard" data-i="' + i + '"><img src="' + flagSrc(c) + '" alt="">'
    + '<span class="q">?</span></div>').join('');
  [...g.children].forEach(el => el.onclick = () => flipCard(el, mCards[+el.dataset.i]));
  $('mprog').textContent = '같은 국기 두 장을 찾아보세요';
  showScreen('matchScreen', '🃏 짝 맞추기');
}
function flipCard(el, c){
  if(mLock || el.classList.contains('up') || el.classList.contains('done')) return;
  el.classList.add('up');
  say(c.ko, 'ko-KR', 'name_' + c.cc);
  mOpen.push({ el, c });
  if(mOpen.length < 2) return;
  mLock = true;
  const [a, b] = mOpen;
  const same = a.c.cc === b.c.cc;
  setTimeout(() => {
    a.el.classList.remove('up'); b.el.classList.remove('up');
    if(same){ a.el.classList.add('done'); b.el.classList.add('done'); }
    mOpen = []; mLock = false;
    if(same && --mLeft === 0) matchDone();
  }, same ? 550 : 950);
}
function matchDone(){
  stars++; localStorage.setItem('wm-stars', stars); drawStars();
  $('mprog').textContent = '🎉 다 찾았어요!  ⭐ 별을 하나 받았어요';
  const g = $('mgrid');
  g.style.gridTemplateColumns = '1fr';
  g.innerHTML = '<button class="bigbtn go" id="mAgain">🃏 한 번 더</button>'
              + '<button class="bigbtn back" id="mDone">🌍 지도로</button>';
  $('mAgain').onclick = startMatch;
  $('mDone').onclick  = () => $('mapBtn').onclick();
  say('참 잘했어요! 별을 하나 받았어요', 'ko-KR', 'praise');
  confetti();
}

/* ===== 지도에서 찾기 ===== */
// 손가락으로 누를 수 있을 만큼 큰 나라만 냅니다
const FIND_POOL = COUNTRIES.filter(c => QUIZ_CC.indexOf(c.cc) >= 0 && c.b
  && (c.b[2] - c.b[0]) >= 4 && (c.b[3] - c.b[1]) >= 2.5);
let findList = [], findNo = 0, findOn = false;

function startFind(){
  findList = shuffle([...FIND_POOL]).slice(0, 5); findNo = 0; findOn = true;
  showScreen('mapScreen', '🔎 지도에서 찾기');
  $('menuBtn').classList.add('hidden');
  $('mapBtn').classList.remove('hidden');
  $('findBar').classList.remove('hidden');
  $('zoomhint').style.opacity = 0;
  resetCam(); render();
  askFind();
}
function askFind(){
  if(findNo >= findList.length) return findDone();
  const c = findList[findNo];
  $('findText').innerHTML = '<span class="n">' + c.ko + '</span> 어디 있을까요?';
  $('findProg').textContent = (findNo + 1) + ' / ' + findList.length;
  say(eulReul(c.ko) + ' 찾아보세요', 'ko-KR', 'find_' + c.cc);
}
function checkFind(id){
  const c = findList[findNo];
  if(id === c.id){
    findNo++;
    showAnswer(c);
    setTimeout(askFind, 2900);
  } else {
    const w = document.createElement('div');
    w.className = 'wrongflash';
    document.body.appendChild(w);
    setTimeout(() => w.remove(), 500);
    say('다시 찾아보세요', 'ko-KR', 'findagain');
  }
}
function endFind(){ findOn = false; $('findBar').classList.add('hidden'); }
function findDone(){
  endFind();
  stars++; localStorage.setItem('wm-stars', stars); drawStars();
  $('title').textContent = '🌍 세계 여행';
  $('menuBtn').classList.remove('hidden'); $('mapBtn').classList.add('hidden');
  say('참 잘했어요! 별을 하나 받았어요', 'ko-KR', 'praise');
  confetti();
}

function nextQ(){
  if(qNo >= qList.length) return finishQuiz();
  const c = qList[qNo], x = EXTRA[c.cc];
  const type = pick(['flag','cap','fact']);
  const q = {
    flag: ['<b>'+c.ko+'</b>의 국기는 어느 것일까요?', '🚩', c.ko+'의 국기는 어느 것일까요?'],
    cap : ['수도가 <b>'+c.cap+'</b>인 나라는?', '🏛️', '수도가 '+c.cap+'인 나라는 어디일까요?'],
    fact: [x.fact + '<br>어느 나라일까요?', x.emo, x.fact + '. 어느 나라일까요?']
  }[type];

  $('qprog').textContent = (qNo+1) + ' / ' + qList.length;
  $('qsub').textContent = q[1];
  $('qtext').innerHTML = q[0];
  say(q[2], 'ko-KR', 'q_' + type + '_' + c.cc);

  const opts = shuffle([c, ...shuffle(QUIZ_POOL.filter(o => o.id !== c.id)).slice(0,2)]);
  const bx = $('qopts'); bx.innerHTML = '';
  let locked = false;
  opts.forEach(o => {
    const d = document.createElement('div');
    d.className = 'opt';
    d.innerHTML = '<img src="' + flagSrc(o) + '" alt="' + o.ko + '">';
    d.onclick = () => {
      if(locked) return;
      if(o.id === c.id){
        locked = true; d.classList.add('ok');
        showAnswer(c);
        qNo++; setTimeout(nextQ, 2900);
      } else {
        d.classList.add('no'); setTimeout(() => d.classList.remove('no'), 500);
      }
    };
    bx.appendChild(d);
  });
}

/* 정답! — 국기를 크게 띄우고, 칭찬한 뒤 나라 이름을 한 번 더 들려줍니다 */
function showAnswer(c){
  const el = document.createElement('div');
  el.className = 'answer';
  el.innerHTML = '<div class="abox"><img src="' + flagSrc(c) + '" alt="' + c.ko + ' 국기">'
    + '<b>' + c.ko + '</b><span class="ok">정답이에요!</span></div>';
  document.body.appendChild(el);
  setTimeout(() => el.classList.add('on'), 16);

  say(c.ko + ', 정답이에요!', 'ko-KR', 'ok_' + c.cc,
      () => setTimeout(() => say(c.ko, 'ko-KR', 'name_' + c.cc), 250));

  setTimeout(() => {
    el.classList.remove('on');
    setTimeout(() => el.remove(), 320);
  }, 2500);
}

function finishQuiz(){
  stars++; localStorage.setItem('wm-stars', stars); drawStars();
  $('qprog').textContent = ''; $('qsub').textContent = '🎉';
  $('qtext').innerHTML = '다 맞혔어요!<br>⭐ 별을 하나 받았어요';
  $('qopts').innerHTML =
    '<button class="bigbtn go" id="againBtn">🎯 더 풀기</button>' +
    '<button class="bigbtn back" id="doneBtn">🌍 지도로</button>';
  $('againBtn').onclick = startQuiz;
  $('doneBtn').onclick  = () => $('mapBtn').onclick();
  say('참 잘했어요! 별을 하나 받았어요', 'ko-KR', 'praise');
  confetti();
}
function confetti(){
  const cols = ['#ff7a2f','#4c9bff','#25c26e','#f5a623','#ff5fa2'];
  for(let i=0;i<40;i++){
    const c = document.createElement('div'); c.className = 'confetti';
    c.style.left = Math.random()*100 + 'vw'; c.style.background = cols[i%cols.length];
    document.body.appendChild(c);
    c.animate([{transform:'translateY(0) rotate(0)',opacity:1},
      {transform:'translateY(110vh) rotate(' + 720*Math.random() + 'deg)',opacity:.9}],
      {duration:1800 + Math.random()*1200, easing:'ease-in'}).onfinish = () => c.remove();
  }
}

drawStars();
measure();
resetCam();
render();
setTimeout(todayCountry, 900);          // 하루에 한 번, 오늘의 나라 소개
setTimeout(() => { $('zoomhint').style.opacity = 0; }, 6000);
</script>
